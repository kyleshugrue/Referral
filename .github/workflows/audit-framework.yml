name: Referral audit framework

on:
  push:
    paths:
      - 'AGENTS.md'
      - 'audit/config/**'
      - 'audit/schema/**'
      - 'audit/codex/**'
      - '.github/workflows/audit-framework.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'audit/config/**'
      - 'audit/schema/**'
      - 'audit/codex/**'
      - '.github/workflows/audit-framework.yml'

permissions:
  contents: read

jobs:
  framework-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail-closed framework tests
        run: node audit/codex/run.mjs self-test
      - name: Verify contract counts and target
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('audit/config/review-contract.json','utf8'));
          if (c.criticalFlows.length !== 11) throw new Error('Expected 11 critical flows');
          if (c.categories.length !== 12) throw new Error('Expected 12 categories');
          if (c.targetScorePerFactor !== 9) throw new Error('Expected per-factor target 9/10');
          if (c.alertSurfaces.length !== 4) throw new Error('Expected four alert surfaces');
          console.log('Contract invariants verified.');
          NODE
