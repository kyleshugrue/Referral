name: CI

on:
  push:
    branches:
      - main
      - "showcase-sync/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Pin npm version with sanitized configuration
        run: |
          set -Eeuo pipefail
          env \
            -u NODE_ENV \
            -u NPM_CONFIG_PRODUCTION -u npm_config_production \
            -u NPM_CONFIG_OMIT -u npm_config_omit \
            -u NPM_CONFIG_INCLUDE -u npm_config_include \
            -u NPM_CONFIG_BIN_LINKS -u npm_config_bin_links \
            -u NPM_CONFIG_INSTALL_LINKS -u npm_config_install_links \
            -u NPM_CONFIG_LEGACY_PEER_DEPS -u npm_config_legacy_peer_deps \
            -u NPM_CONFIG_PACKAGE_LOCK -u npm_config_package_lock \
            -u NPM_CONFIG_REGISTRY -u npm_config_registry \
            -u NPM_CONFIG_USERCONFIG -u npm_config_userconfig \
            NODE_ENV=development \
            NPM_CONFIG_PRODUCTION=false \
            NPM_CONFIG_INCLUDE=dev \
            NPM_CONFIG_BIN_LINKS=true \
            NPM_CONFIG_INSTALL_LINKS=true \
            NPM_CONFIG_LEGACY_PEER_DEPS=true \
            NPM_CONFIG_PACKAGE_LOCK=true \
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ \
            NPM_CONFIG_USERCONFIG="$GITHUB_WORKSPACE/.npmrc" \
            npm install -g npm@10.8.2

      - name: Validate public checkout in a clean room
        run: npm run validate:public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
