name: Referral CodeQL configuration

# csrf-sync provides the synchronizer-token middleware used by this app, but
# CodeQL's Express model does not recognize that package as a CSRF protector.
# Keep this exclusion limited to that middleware registration file and its
# generated build output; all other missing-token-validation findings remain
# release-blocking.
queries:
  - uses: security-and-quality
query-filters:
  - exclude:
      id: js/missing-token-validation
      paths:
        - "**/server/auth.ts"
        - "**/dist/**"
