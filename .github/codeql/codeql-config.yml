name: Referral CodeQL configuration

# csrf-sync provides the synchronizer-token middleware used by this app, but
# CodeQL's Express model does not recognize that package as a CSRF protector.
# Keep file-scope exclusions limited to that middleware registration file and
# generated build output; all other application paths remain release-blocking.
queries:
  - uses: security-and-quality
paths-ignore:
  - "**/server/auth.ts"
  - "**/dist/**"
